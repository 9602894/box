name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      base_version:
        description: '基础版本号（如 1.21.2）。留空则用 package.json 的 version'
        required: false
        type: string
        default: ''
      action:
        description: '操作'
        required: true
        type: choice
        options:
          - build-and-release
          - delete-only
        default: 'build-and-release'
      delete_tag:
        description: '要删除的 tag（如 v1.21.2-2026-10-14-13-05-30-abc1234）'
        required: false
        type: string
        default: ''
      draft:
        description: '发布为草稿'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_PROXY: "https://gh-proxy.com/"

jobs:
  build-windows:
    # 固定回 windows-2022，避免 windows-latest 上的 VS 18 导致 node-gyp 检测失败
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete existing release (if requested)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.delete_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.delete_tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
            echo "✓ Release 已删除"
          fi
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" 2>/dev/null \
            && echo "✓ Tag 已删除" || echo "（无同名 tag）"

      - name: Resolve full version
        if: github.event.inputs.action != 'delete-only'
        id: ver
        shell: pwsh
        run: |
          $base = "${{ github.event.inputs.base_version }}".Trim()
          if (-not $base) {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $base = $pkg.version
          }
          $base = $base -replace '^v', ''
          if ($base -notmatch '^\d+\.\d+\.\d+') { throw "基础版本号格式非法：$base" }
          $bj = (Get-Date).ToUniversalTime().AddHours(8)
          $bjStamp = $bj.ToString('yyyy-MM-dd-HH-mm-ss')
          $sha = "${{ github.sha }}"
          $shortSha = $sha.Substring(0, 7)
          $full = "${base}-${bjStamp}-${shortSha}"
          $tag  = "v$full"
          "base=$base"              >> $env:GITHUB_OUTPUT
          "bj_stamp=$bjStamp"       >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha"     >> $env:GITHUB_OUTPUT
          "full=$full"              >> $env:GITHUB_OUTPUT
          "tag=$tag"                >> $env:GITHUB_OUTPUT
          "output_dir=release$full" >> $env:GITHUB_OUTPUT

      - name: Apply version to package.json
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.full }}"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $v
          if ($pkg.build.directories.output) { $pkg.build.directories.output = "release$v" }
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json -Encoding utf8

      - name: Setup Node.js
        if: github.event.inputs.action != 'delete-only'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        if: github.event.inputs.action != 'delete-only'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare libmpv SDK (for electron-mpv-video native build)
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $libmpvRoot = "$env:USERPROFILE\libmpv"
          $includeDir = "$libmpvRoot\include"
          $libDir     = "$libmpvRoot\lib"
          $binDir     = "$libmpvRoot\bin"

          if ((Test-Path "$includeDir\mpv\client.h") -and (Test-Path "$includeDir\mpv\render.h") -and (Test-Path "$libDir\mpv.lib") -and (Test-Path "$binDir\libmpv-2.dll")) {
            Write-Host "✓ 完整的 libmpv SDK 已存在，跳过下载"
            exit 0
          }

          Write-Host "🔍 查询最新的 mpv-dev-x86_64 资产..."
          $apiUrl = "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          try {
            $release = Invoke-RestMethod -Uri $apiUrl -Headers @{ "User-Agent" = "github-actions" } -UseBasicParsing
          } catch {
            throw "无法获取最新 Release 信息: $($_.Exception.Message)"
          }

          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "未找到 mpv-dev-x86_64 资产" }

          $sdkUrl = $asset.browser_download_url
          Write-Host "⬇  下载 libmpv SDK: $sdkUrl"
          New-Item -ItemType Directory -Force -Path $includeDir, $libDir, $binDir | Out-Null

          $sdkArchive = Join-Path $env:RUNNER_TEMP "mpv-dev-sdk.7z"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkArchive -UseBasicParsing -TimeoutSec 300

          Write-Host "⚙  提取 libmpv-2.dll → $binDir"
          & "C:\Program Files\7-Zip\7z.exe" e $sdkArchive "libmpv-2.dll" "-o$binDir" -y | Out-Null
          $dllPath = Join-Path $binDir "libmpv-2.dll"
          if (-not (Test-Path $dllPath)) { throw "libmpv-2.dll 提取失败" }

          $extractDir = Join-Path $env:RUNNER_TEMP "mpv-dev-sdk-extract"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          & "C:\Program Files\7-Zip\7z.exe" x $sdkArchive "-o$extractDir" -y | Out-Null

          $mpvHeaderDir = Get-ChildItem $extractDir -Directory -Recurse |
                          Where-Object { $_.Name -eq "mpv" -and (Test-Path "$($_.FullName)\client.h") } |
                          Select-Object -First 1
          if (-not $mpvHeaderDir) { throw "未找到 mpv 头文件目录" }

          $destMpv = Join-Path $includeDir "mpv"
          New-Item -ItemType Directory -Force -Path $destMpv | Out-Null
          Get-ChildItem $mpvHeaderDir.FullName -Filter "*.h" | Copy-Item -Destination $destMpv -Force

          foreach ($h in @("client.h", "render.h")) {
            if (-not (Test-Path "$destMpv\$h")) { throw "头文件缺失：mpv/$h" }
          }
          Write-Host "✓ mpv 头文件已完整复制（client.h, render.h 等）"

          $mpvLibDest = Join-Path $libDir "mpv.lib"
          $existingLib = Get-ChildItem $extractDir -Filter "mpv.lib" -Recurse | Select-Object -First 1
          if ($existingLib) {
            Copy-Item $existingLib.FullName -Destination $mpvLibDest -Force
            Write-Host "✓ [Level 1] 使用包内预编译的 mpv.lib"
          } else {
            Write-Host "⚙  [Level 2] 从 libmpv-2.dll 生成 mpv.def / mpv.lib ..."
            $dumpbin = $null; $libExe = $null
            $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vsWhere) {
              $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($vsPath) {
                $toolset = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue |
                           Sort-Object Name -Descending | Select-Object -First 1
                if ($toolset) {
                  $binPath = "$($toolset.FullName)\bin\Hostx64\x64"
                  $dumpbin = Join-Path $binPath "dumpbin.exe"
                  $libExe  = Join-Path $binPath "lib.exe"
                }
              }
            }
            if (-not (Test-Path $dumpbin)) {
              $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
              $libExe  = (Get-Command lib.exe -ErrorAction SilentlyContinue).Source
            }
            if (-not $dumpbin -or -not $libExe) { throw "未找到 dumpbin.exe 或 lib.exe" }

            $defPath = Join-Path $libDir "mpv.def"
            $exportsRaw = & $dumpbin /exports $dllPath 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin 执行失败" }

            $defLines = @("LIBRARY libmpv-2.dll", "EXPORTS")
            foreach ($line in $exportsRaw) {
              if ($line -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
                $defLines += "    $($matches[1])"
              }
            }
            if ($defLines.Count -le 2) { throw "dumpbin 未解析到导出符号" }
            $defLines | Out-File -FilePath $defPath -Encoding ascii

            Push-Location $libDir
            & $libExe /def:mpv.def "/out:$mpvLibDest" /machine:x64 2>&1 | Out-Null
            Pop-Location
            if (-not (Test-Path $mpvLibDest)) { throw "lib.exe 生成 mpv.lib 失败" }
            Write-Host "✓ [Level 2] 已从 libmpv-2.dll 生成 mpv.lib"
          }

          if (-not (Test-Path "$includeDir\mpv\client.h")) { throw "mpv/client.h 未找到" }
          if (-not (Test-Path "$includeDir\mpv\render.h")) { throw "mpv/render.h 未找到" }
          if (-not (Test-Path $mpvLibDest)) { throw "mpv.lib 未就绪" }
          Write-Host "✅ libmpv SDK 准备完成（头文件齐全）"

      - name: Set libmpv SDK environment variables
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $mpvRoot = "$env:USERPROFILE\libmpv"
          echo "MPV_INCLUDE_DIR=$mpvRoot\include" >> $env:GITHUB_ENV
          echo "MPV_LIB=$mpvRoot\lib\mpv.lib" >> $env:GITHUB_ENV
          echo "MPV_RUNTIME_DIR=$mpvRoot\bin" >> $env:GITHUB_ENV

      - name: Install dependencies
        if: github.event.inputs.action != 'delete-only'
        run: npm install

      - name: Download libmpv runtime (for packaging)
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $mpvDir = "resources/libmpv"
          if (Test-Path "$mpvDir/libmpv-2.dll") {
            Write-Host "✓ libmpv-2.dll 已存在，跳过下载"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/latest/download/mpv-dev-x86_64.7z"
          $archive = Join-Path $env:RUNNER_TEMP "libmpv-runtime.7z"
          Write-Host "⬇  下载 libmpv 运行时: $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing -TimeoutSec 300
          & "C:\Program Files\7-Zip\7z.exe" e $archive "libmpv-2.dll" "-o$mpvDir" -y | Out-Null
          if (-not (Test-Path "$mpvDir/libmpv-2.dll")) { throw "libmpv-2.dll 未在压缩包中找到" }
          Write-Host "✓ libmpv-2.dll → $mpvDir"

      - name: Print repository resources tree
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          Write-Host "========== 本仓库 resources/ 完整树 =========="
          if (Test-Path "resources") {
            Get-ChildItem "resources" -Recurse -File |
              Select-Object @{n='Path';e={$_.FullName.Replace($PWD.Path + '\', '')}}, Length |
              Format-Table -AutoSize
          } else {
            throw "本仓库没有 resources 目录"
          }

      - name: Prepare JRE
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $jreDir = "resources/jvm/jre"
          if (Test-Path "$jreDir/bin/java.exe") {
            Write-Host "✓ JRE 已存在"
            & "$jreDir/bin/java.exe" -version
            exit 0
          }
          Write-Host "⬇  从 Adoptium 下载 JRE 21"
          New-Item -ItemType Directory -Force -Path $jreDir | Out-Null
          $url = "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          $zip = Join-Path $env:RUNNER_TEMP "jre.zip"
          $extract = Join-Path $env:RUNNER_TEMP "jre-extract"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600; break }
            catch { if ($attempts -ge 3) { throw "JRE download failed" }; Start-Sleep -Seconds 5 }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1
          Get-ChildItem -Path $inner.FullName -Force | Move-Item -Destination $jreDir -Force
          & "$jreDir/bin/java.exe" -version

      - name: Prepare dex2jar
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $d2j = "resources/jvm/d2j"
          $mainJar = Get-ChildItem $d2j -Filter "dex-tools-*.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mainJar) {
            Write-Host "✓ dex2jar 已存在：$($mainJar.Name)"
            exit 0
          }
          Write-Host "⬇  从 GitHub Releases 下载 dex2jar v2.4（经镜像加速）"
          $zip = Join-Path $env:RUNNER_TEMP "dex-tools.zip"
          $extract = Join-Path $env:RUNNER_TEMP "dex-tools"
          $rawUrl = "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip"
          $url = "$env:GH_PROXY$rawUrl"
          $attempts = 0
          while ($attempts -lt 3) {
            $attempts++
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300; break }
            catch { if ($attempts -ge 3) { throw "dex2jar download failed" }; Start-Sleep -Seconds 5 }
          }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem $extract -Directory | Select-Object -First 1

          New-Item -ItemType Directory -Force -Path $d2j | Out-Null
          Get-ChildItem "$($inner.FullName)/*.jar" | Copy-Item -Destination $d2j -Force
          if (Test-Path "$($inner.FullName)/lib") {
            Get-ChildItem "$($inner.FullName)/lib/*.jar" | Copy-Item -Destination $d2j -Force
          }
          Get-ChildItem "$($inner.FullName)/*.bat" -ErrorAction SilentlyContinue | Copy-Item -Destination $d2j -Force
          Get-ChildItem "$($inner.FullName)/*.sh"  -ErrorAction SilentlyContinue | Copy-Item -Destination $d2j -Force

          $libs = "resources/jvm/libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          $allJars = Get-ChildItem $d2j -Filter "*.jar" -Recurse -File
          foreach ($jar in $allJars) {
            Copy-Item $jar.FullName -Destination $libs -Force
          }

      - name: Prepare Maven deps
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $libs = "resources/jvm/libs"
          New-Item -ItemType Directory -Force -Path $libs | Out-Null
          $maven = @(
            @{ n = "gson-2.10.1.jar";           u = "https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar" },
            @{ n = "okhttp-3.14.9.jar";         u = "https://repo1.maven.org/maven2/com/squareup/okhttp3/okhttp/3.14.9/okhttp-3.14.9.jar" },
            @{ n = "okio-1.17.5.jar";           u = "https://repo1.maven.org/maven2/com/squareup/okio/okio/1.17.5/okio-1.17.5.jar" },
            @{ n = "jsoup-1.17.2.jar";          u = "https://repo1.maven.org/maven2/org/jsoup/jsoup/1.17.2/jsoup-1.17.2.jar" },
            @{ n = "json-20180813.jar";         u = "https://repo1.maven.org/maven2/org/json/json/20180813/json-20180813.jar" },
            @{ n = "bcprov-jdk18on-1.78.1.jar"; u = "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar" },
            @{ n = "slf4j-api-2.0.16.jar";      u = "https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar" },
            @{ n = "slf4j-simple-2.0.16.jar";   u = "https://repo1.maven.org/maven2/org/slf4j/slf4j-simple/2.0.16/slf4j-simple-2.0.16.jar" },
            @{ n = "sqlite-jdbc-3.46.1.0.jar";  u = "https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.46.1.0/sqlite-jdbc-3.46.1.0.jar" }
          )
          foreach ($m in $maven) {
            $dest = Join-Path $libs $m.n
            if (Test-Path $dest) { Write-Host "✓ $($m.n)"; continue }
            Write-Host "⬇  $($m.n)"
            Invoke-WebRequest -Uri $m.u -OutFile $dest -UseBasicParsing -TimeoutSec 120
          }

      - name: Patch stubs-src
        if: github.event.inputs.action != 'delete-only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/jvm/stubs-src/android/content
          mkdir -p resources/jvm/stubs-src/com/github/catvod/net

          cat > resources/jvm/stubs-src/android/content/SharedPreferences.java << 'JAVAEOF'
          package android.content;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          public interface SharedPreferences {
              Map<String, SharedPreferences> Mem = new ConcurrentHashMap<>();
              String getString(String key, String defValue);
              int getInt(String key, int defValue);
              long getLong(String key, long defValue);
              boolean getBoolean(String key, boolean defValue);
              float getFloat(String key, float defValue);
              Editor edit();
              interface Editor {
                  Editor putString(String key, String value);
                  Editor putInt(String key, int value);
                  Editor putLong(String key, long value);
                  Editor putBoolean(String key, boolean value);
                  Editor putFloat(String key, float value);
                  boolean commit();
                  void apply();
              }
          }
          JAVAEOF

          cat > resources/jvm/stubs-src/com/github/catvod/net/OkHttp.java << 'JAVAEOF'
          package com.github.catvod.net;
          import okhttp3.Dns;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.ResponseBody;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;
          public class OkHttp {
              private static OkHttpClient client;
              public static Dns dns() { return Dns.SYSTEM; }
              public static OkHttpClient client() {
                  if (client == null) {
                      client = new OkHttpClient.Builder()
                              .connectTimeout(30, TimeUnit.SECONDS)
                              .readTimeout(30, TimeUnit.SECONDS)
                              .writeTimeout(30, TimeUnit.SECONDS)
                              .build();
                  }
                  return client;
              }
              public static String string(String url) throws Exception { return string(url, null); }
              public static String string(String url, Map<String, String> headers) throws Exception {
                  Request.Builder b = new Request.Builder().url(url);
                  if (headers != null) {
                      for (Map.Entry<String, String> e : headers.entrySet()) b.addHeader(e.getKey(), e.getValue());
                  }
                  try (Response resp = client().newCall(b.build()).execute()) {
                      ResponseBody body = resp.body();
                      return body == null ? "" : body.string();
                  }
              }
          }
          JAVAEOF

      - name: Compile stubs.jar
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $stubsSrc = "resources/jvm/stubs-src"
          if (-not (Test-Path $stubsSrc)) {
            if (Test-Path "resources/jvm/stubs/stubs.jar") { exit 0 }
            throw "既没 stubs-src 也没 stubs.jar"
          }

          $stubsDir = "resources/jvm/stubs"
          $classes  = Join-Path $stubsDir "classes"
          New-Item -ItemType Directory -Force -Path $stubsDir | Out-Null
          Remove-Item -Recurse -Force $classes -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $classes | Out-Null

          $androidAll = Join-Path $stubsDir "android-all-base.jar"
          if (-not (Test-Path $androidAll)) {
            $url = "https://repo1.maven.org/maven2/org/robolectric/android-all/14-robolectric-10818077/android-all-14-robolectric-10818077.jar"
            Invoke-WebRequest -Uri $url -OutFile $androidAll -UseBasicParsing -TimeoutSec 900
          }

          $sources = @(Get-ChildItem -Path $stubsSrc -Recurse -Filter "*.java" | ForEach-Object { $_.FullName })
          $spiderRunner = "resources/jvm/SpiderRunner.java"
          if (Test-Path $spiderRunner) { $sources += (Resolve-Path $spiderRunner).Path }

          $libs = Get-ChildItem "resources/jvm/libs" -Filter "*.jar" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $cp = (@($libs) + @($androidAll)) -join ";"
          javac -encoding UTF-8 -cp $cp -d $classes $sources
          if ($LASTEXITCODE -ne 0) { throw "javac failed" }

          $stubsJar = Join-Path $stubsDir "stubs.jar"
          Copy-Item $androidAll $stubsJar -Force
          Push-Location $classes
          & jar uf "../stubs.jar" .
          Pop-Location
          Remove-Item -Force $androidAll -ErrorAction SilentlyContinue

      - name: Verify resources
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $must = @(
            "resources/js-lib",
            "resources/jvm/jre/bin/java.exe",
            "resources/jvm/stubs/stubs.jar",
            "resources/jvm/d2j/dex-tools-v2.4.jar",
            "resources/jvm/libs",
            "resources/libmpv/libmpv-2.dll"
          )
          $missing = @()
          foreach ($m in $must) { if (-not (Test-Path $m)) { $missing += $m } }
          if ($missing.Count -gt 0) { throw "缺失：$($missing -join ', ')" }
          Write-Host "✓ 所有关键资源就绪"

      - name: Run typecheck
        if: github.event.inputs.action != 'delete-only'
        run: npm run typecheck

      - name: Run tests
        if: github.event.inputs.action != 'delete-only'
        continue-on-error: true
        run: npm run test

      - name: Build application
        if: github.event.inputs.action != 'delete-only'
        run: npm run build

      - name: Create placeholder LICENSE.txt
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          if (-not (Test-Path "LICENSE.txt")) {
            "MIT License`n`nCopyright (c) 2026 Win-Box" | Out-File -Encoding utf8 LICENSE.txt
          }

      - name: Package with electron-builder
        if: github.event.inputs.action != 'delete-only'
        run: npx electron-builder --win --publish never

      - name: List release dir
        if: github.event.inputs.action != 'delete-only'
        shell: pwsh
        run: |
          $dir = "${{ steps.ver.outputs.output_dir }}"
          if (Test-Path $dir) {
            Get-ChildItem $dir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            throw "release 目录不存在: $dir"
          }

      - name: Upload build artifacts
        if: github.event.inputs.action != 'delete-only'
        uses: actions/upload-artifact@v4
        with:
          name: win-box-installer-${{ steps.ver.outputs.full }}
          path: |
            ${{ steps.ver.outputs.output_dir }}/*.exe
            ${{ steps.ver.outputs.output_dir }}/*.blockmap
            ${{ steps.ver.outputs.output_dir }}/latest.yml

      - name: Upload to GitHub Release
        if: github.event_name != 'pull_request' && github.event.inputs.action != 'delete-only'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Win-Box ${{ steps.ver.outputs.base }} · ${{ steps.ver.outputs.bj_stamp }}
          body: |
            ## Win-Box ${{ steps.ver.outputs.base }} · ${{ steps.ver.outputs.bj_stamp }}

            > 北京时间：`${{ steps.ver.outputs.bj_stamp }}`（UTC+8）
            > Commit：`${{ github.sha }}`

            ### 下载
            - `Win-Box Setup ${{ steps.ver.outputs.full }}.exe`
            - `latest.yml` / `*.blockmap`
          files: |
            ${{ steps.ver.outputs.output_dir }}/*.exe
            ${{ steps.ver.outputs.output_dir }}/*.blockmap
            ${{ steps.ver.outputs.output_dir }}/latest.yml
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
